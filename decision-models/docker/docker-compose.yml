# 容器化部署：一个镜像，三个服务（每模型一个容器）
#
#   docker compose up -d
#   docker compose ps
#   curl -s localhost:8012/health
#
# 镜像 decision-gateway:local 内含 torch 2.14+cu130 / transformers 5.17 /
# cuDNN 9.24 / qev / flash-linear-attention，运行时不联网。
# 权重挂载在 MODEL_ROOT（默认 /home/sakana/models/decision-models），不进镜像。

x-gateway: &gateway
  image: decision-gateway:local
  restart: unless-stopped
  volumes:
    - ${MODEL_ROOT:-/home/sakana/models/decision-models}:/models:ro
    # 把 Triton/CUDA 的 JIT 缓存落到宿主，容器重建后不用重新编译（首次 7–15 s）
    - dg-triton-cache:/root/.triton
    - dg-cuda-cache:/root/.nv/ComputeCache
  shm_size: "2gb"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  gw-elephant:
    <<: *gateway
    container_name: gw-elephant
    ports: ["8012:8000"]
    environment:
      MODEL: elephant-1
      PRELOAD: elephant-1
      DEVICE: cuda:0

  gw-flash:
    <<: *gateway
    container_name: gw-flash
    ports: ["8014:8000"]
    environment:
      MODEL: pplx-decider-flash-v1.3
      PRELOAD: pplx-decider-flash-v1.3
      DEVICE: cuda:0
      PPLX_MODE: isolated          # state 只编码一次（多问题共享）
      PPLX_FAST: "1"               # 打包 + CUDA graphs
      PPLX_MAX_TOKENS: "0"         # 不截断
      # CUDA graphs 按形状抓取，启动时把常用桶预热掉（每个桶首请求不再多花 7–12 s）
      PPLX_WARM_TOKENS: 1000,4000,8000,16000,24000

  gw-glide:
    <<: *gateway
    container_name: gw-glide
    ports: ["8015:8000"]
    environment:
      MODEL: GLiDE-0.4B
      PRELOAD: GLiDE-0.4B
      DEVICE: cuda:0

volumes:
  dg-triton-cache:
  dg-cuda-cache:
